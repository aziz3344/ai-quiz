<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Women's Bible — Your Daily Prayer & Peace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff8fb1;
      --primary-dark: #d9527a;
      --glass-rose: linear-gradient(145deg, rgba(255, 182, 206, 0.28), rgba(224, 105, 142, 0.16));
      --glass-border: rgba(255, 205, 222, 0.45);
      --text-main: #ffffff;
      --text-muted: rgba(255, 232, 240, 0.85);
      --gold: #ffd166;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
      background: #1a0f19;
    }

    /* ===== Animated Celestial Rose-Gold Background ===== */
    .bg-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #21101f 0%, #4b1d38 45%, #8d3d5e 80%, #d47a92 100%);
      background-size: 200% 200%;
      animation: bgGradientMove 14s ease infinite;
    }

    @keyframes bgGradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glowing Floating Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.65;
      pointer-events: none;
      will-change: transform;
    }

    .orb-1 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, #ff96b9, #d94c7a);
      top: -80px;
      left: -80px;
      animation: floatOrb1 12s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 310px;
      height: 310px;
      background: radial-gradient(circle, #ffd194, #d47d55);
      bottom: -90px;
      right: -70px;
      animation: floatOrb2 15s ease-in-out infinite alternate;
    }

    .orb-3 {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, #f582ae, #9d3c72);
      top: 38%;
      left: 52%;
      animation: floatOrb3 11s ease-in-out infinite alternate;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(65px, 85px) scale(1.2); }
    }

    @keyframes floatOrb2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-75px, -65px) scale(1.22); }
    }

    @keyframes floatOrb3 {
      0% { transform: translate(0, 0) scale(0.95); }
      100% { transform: translate(-55px, 50px) scale(1.18); }
    }

    #sparklesCanvas {
      position: fixed;
      inset: 0;
