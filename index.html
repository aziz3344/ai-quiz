<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d12">
  <meta name="robots" content="noindex, nofollow">
  <title>HotBabes — Pogledaj sada</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #f018b5;
      --pink-dark: #a60a7f;
      --pink-glow: rgba(240, 24, 181, 0.35);
      --bg-body: #0b0c12;
      --bg-card: #15161d;
      --text-main: #ffffff;
      --text-muted: #a8a5b5;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-pink: rgba(240, 24, 181, 0.3);
      --radius-lg: 18px;
      --radius-md: 12px;
      --transition: 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px 12px 36px;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(240, 24, 181, 0.18), transparent 55%),
        radial-gradient(circle at 80% 100%, rgba(46, 79, 139, 0.25), transparent 50%),
        var(--bg-body);
      -webkit-font-smoothing: antialiased;
    }

    /* Main Container */
    .page {
      width: min(100%, 580px);
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
    }

    /* Header */
    header {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
    }

    .logo {
      font-size: clamp(24px, 6vw, 34px);
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
      user-select: none;
    }

    .logo span {
      color: var(--pink);
      text-shadow: 0 0 20px var(--pink-glow);
    }

    .age-badge {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--pink);
      background: rgba(240, 24, 181, 0.1);
      color: var(--pink);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px;
    }

    main {
      text-align: center;
    }

    /* Hero Section */
    .hero {
      padding: 28px 22px 26px;
    }

    .hero-media {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      background: linear-gradient(135deg, #2b2d42, #6b2d5c, #181824);
    }

    .hero-image {
      width: 100%;
      height: clamp(200px, 52vw, 300px);
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .hero-media:hover .hero-image {
      transform: scale(1.03);
    }

    .live-pill {
      position: absolute;
      top: 12px;
      left: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 15, 22, 0.78);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: blink 1.5s infinite;
    }

    h1 {
      margin-top: 24px;
      font-size: clamp(22px, 5.2vw, 32px);
      line-height: 1.22;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.3px;
    }

    .sub {
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.6;
      margin: 10px auto 0;
      max-width: 420px;
    }

    /* Gallery Section */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 22px;
      border-top: 1px solid var(--border-pink);
      border-bottom: 1px solid var(--border-pink);
      background: linear-gradient(180deg, rgba(240, 24, 181, 0.08), rgba(20, 20, 28, 0.3));
    }

    .tile {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #3c2a4d, #8a3a6a, #1d2233);
      text-decoration: none;
      transition: border-color var(--transition), transform var(--transition);
    }

    .tile:hover {
      border-color: var(--pink);
      transform: translateY(-2px);
    }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .tile:hover img {
      transform: scale(1.07);
    }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(15, 16, 26, 0.72);
      backdrop-filter: blur(4px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      transition: background var(--transition), transform var(--transition);
    }

    .tile:hover .play {
      background: var(--pink);
      border-color: #fff;
      transform: translate(-50%, -50%) scale(1.08);
    }

    .play::after {
      content: "";
      margin-left: 4px;
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 15px solid #fff;
    }

    /* Bottom CTA Section */
    .bottom {
      padding: 40px 22px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(240, 24, 181, 0.16), transparent 70%),
        #111218;
    }

    .cta {
      width: min(100%, 420px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 24px;
      border-radius: var(--radius-md);
      color: #fff;
      text-decoration: none;
      font-size: clamp(19px, 4.8vw, 24px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: linear-gradient(180deg, var(--pink), var(--pink-dark));
      box-shadow: 0 10px 30px var(--pink-glow);
      transition: transform var(--transition), filter var(--transition), box-shadow var(--transition);
      animation: pulse-glow 2.4s infinite;
    }

    .cta:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: 0 14px 36px rgba(240, 24, 181, 0.5);
    }

    .cta:active {
      transform: translateY(0);
    }

    .fine {
      color: #8c8999;
      font-size: 11.5px;
      line-height: 1.6;
      margin-top: 18px;
      max-width: 420px;
    }

    /* Footer */
    footer {
      padding: 16px;
      text-align: center;
      color: #6b6878;
      font-size: 11.5px;
      background: #0d0e13;
      border-top: 1px solid var(--border-subtle);
    }

    /* Animations */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 10px 28px rgba(240, 24, 181, 0.35); }
      50% { box-shadow: 0 10px 38px rgba(240, 24, 181, 0.6); }
    }

    /* Mobile Adjustments */
    @media (max-width: 420px) {
      body { padding: 0; }
      .page {
        border-radius: 0;
        border: 0;
      }
      .hero, .gallery, .bottom {
        padding-left: 16px;
        padding-right: 16px;
      }
      .age-badge {
        width: 38px;
        height: 38px;
        right: 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Main Landing Page -->
  <div class="page">
    <header>
      <div class="logo"><span>HOT</span>BABES</div>
      <div class="age-badge" aria-label="18 plus">18+</div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-media">
          <span class="live-pill"><span class="live-dot"></span> Aktivno sada</span>
          <!-- Replace hero.jpg with your approved banner image -->
          <img class="hero-image" src="hero.jpg" alt="Promotivna fotografija">
        </div>
        <h1>Vruće devojke koje tražite...</h1>
        <p class="sub">Pogledaj ekskluzivnu ponudu i otkrij više. Klikni ispod da nastaviš odmah.</p>
      </section>

      <section class="gallery" aria-label="Pregled sadržaja">
        <!-- Replace card-1.jpg and card-2.jpg with your own creatives -->
        <a class="tile offer-link" href="#" rel="noopener noreferrer" aria-label="Pogledaj prvi pregled">
          <img src="card-1.jpg" alt="Pregled ponude 1" loading="lazy">
          <span class="play" aria-hidden="true"></span>
        </a>
        <a class="tile offer-link" href="#" rel="noopener noreferrer" aria-label="Pogledaj drugi pregled">
          <img src="card-2.jpg" alt="Pregled ponude 2" loading="lazy">
          <span class="play" aria-hidden="true"></span>
        </a>
      </section>

      <section class="bottom">
        <a class="cta offer-link" href="#" rel="noopener noreferrer">Gledaj sad! &rarr;</a>
        <p class="fine">18+ · Sadržaj i dostupnost zavise od ponude i lokacije. Nastavkom prihvataš uslove povezane sa ponudom.</p>
      </section>
    </main>

    <footer>© 2026 HotBabes · Samo za punoletne osobe</footer>
  </div>

  <script>
    (() => {
      // بدّل YOUR_OFFER_URL برابط العرض ديالك هنا
      const offerUrl = 'https://quwjsmz.com/cl/1bfe32904c3d54a8?p1={click_id}&p2={format}&source=trafficstars&site={site_id}';

      document.querySelectorAll('.offer-link').forEach(link => {
        link.href = offerUrl;
      });
    })();
  </script>
</body>
</html>
